name: Verify local v1
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
        env:
          POSTGRES_USER: evidencelens
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: evidencelens_test_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U evidencelens -d evidencelens_test_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://evidencelens:local_ci_only@127.0.0.1:5432/evidencelens_test_ci
      TEST_DATABASE_URL: postgresql+psycopg://evidencelens:local_ci_only@127.0.0.1:5432/evidencelens_test_ci
      NEXT_TELEMETRY_DISABLED: "1"
      MODEL_MODE: fixture
      PARSER_BACKEND: subprocess
      E2E_ACCESSIBILITY: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: pip install -r backend/requirements-dev.lock
      - run: PGPASSWORD=local_ci_only psql -h 127.0.0.1 -U evidencelens -d evidencelens_test_ci -c 'CREATE EXTENSION IF NOT EXISTS vector'
      - run: python -m alembic upgrade head
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend
      - run: npm ci
        working-directory: apps/web
      - run: python scripts/export-openapi.py
      - run: npm run api:generate
        working-directory: apps/web
      - run: git diff --exit-code -- apps/web/lib/openapi.json apps/web/lib/schema.d.ts
      - run: npm run typecheck && npm run build
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/evidencelens-api.log 2>&1 &
          python -m app.worker > /tmp/evidencelens-worker.log 2>&1 &
        working-directory: backend
      - run: |
          npm start > /tmp/evidencelens-web.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/v1/health/ready; then exit 0; fi
            sleep 1
          done
          exit 1
        working-directory: apps/web
      - run: npm run test:e2e
        working-directory: apps/web
      - run: node e2e-pdf.mjs
        working-directory: apps/web
      - run: python scripts/evaluate.py --suite fixture --output docs/evaluation-ci.json
      - run: npm audit --audit-level=moderate
        working-directory: apps/web
      - run: |
          python -m venv /tmp/evidencelens-audit
          /tmp/evidencelens-audit/bin/pip install pip-audit==2.10.1 bandit==1.9.4
          /tmp/evidencelens-audit/bin/pip-audit -r backend/requirements-dev.lock --no-deps --disable-pip
          /tmp/evidencelens-audit/bin/bandit -r backend/app -ll
          python scripts/check-secrets.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: local-workflow-evidence
          path: |
            docs/screenshots
            docs/evaluation-ci.json
