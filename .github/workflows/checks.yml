name: Verify fixture workflow
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: evidencelens
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: evidencelens_test_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U evidencelens -d evidencelens_test_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://evidencelens:local_ci_only@127.0.0.1:5432/evidencelens_test_ci
      TEST_DATABASE_URL: postgresql+psycopg://evidencelens:local_ci_only@127.0.0.1:5432/evidencelens_test_ci
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: pip install -r backend/requirements.lock
      - run: python -m alembic upgrade head
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend
      - run: npm ci
        working-directory: apps/web
      - run: python scripts/export-openapi.py
      - run: npm run api:generate
        working-directory: apps/web
      - run: git diff --exit-code -- apps/web/lib/openapi.json apps/web/lib/schema.d.ts
      - run: npm run typecheck && npm run build
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/evidencelens-api.log 2>&1 &
          python -m app.worker > /tmp/evidencelens-worker.log 2>&1 &
        working-directory: backend
      - run: |
          npm start > /tmp/evidencelens-web.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/v1/health/ready; then exit 0; fi
            sleep 1
          done
          exit 1
        working-directory: apps/web
      - run: npm run test:e2e
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-workflow-evidence
          path: docs/screenshots
